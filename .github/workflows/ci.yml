name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Training dependencies (torch, anomalib) are deliberately not installed in CI.
      - run: pip install ".[serve,dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t industrial-anomaly-inspection .
      # TODO(week 3): push to Artifact Registry and deploy to Cloud Run on tags (see docs/deploy_cloud_run.md).
